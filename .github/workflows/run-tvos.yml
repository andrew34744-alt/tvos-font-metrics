name: Run tvOS Font Check

on:
  workflow_dispatch: # Allows you to trigger this manually with a button click

jobs:
  get-metrics:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run script on Apple TV Simulator
        run: |
          xcodebuild test \
            -scheme TVFontMetrics \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)'

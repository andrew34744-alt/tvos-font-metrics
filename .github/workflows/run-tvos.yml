name: Run tvOS Font Check

on:
  workflow_dispatch:

jobs:
  get-metrics:
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run script on tvOS 27 Simulator
        run: |
          xcodebuild test \
            -scheme TVFontMetrics \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)'

name: Run tvOS Font Check

on:
  workflow_dispatch:

jobs:
  get-metrics:
    runs-on: xcode-27
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Render SwiftUI Screen on tvOS 27 Simulator
        run: |
          xcodebuild test \
            -scheme TVFontMetrics \
            -destination 'platform=tvOS Simulator,name=Apple TV 4K (4th generation)'

      - name: Upload Screenshot Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tvos-swiftui-preview
          path: /tmp/tvos-preview.png
